# ─────────────────────────────────────────────────────────
#  Nimbus tmux   ·   prefix C-a   ·   Ctrl+hjkl unified nav
# ─────────────────────────────────────────────────────────

# Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# General
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename-format '#{?#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},claude,#{pane_current_command}}'
set -sg escape-time 0
set -g history-limit 1000000
set -g detach-on-destroy off   # closing a session jumps to another one instead of leaving tmux
set -g focus-events on
# popups do not read .zshrc, so give them the same fzf look
run 'tmux set-environment -g FZF_DEFAULT_OPTS_FILE "$HOME/.dotfiles/fzf/fzfrc"'
setw -g mode-keys vi
set -g set-clipboard on
set -g allow-passthrough on   # images in nvim (vellum, snacks.image) via Ghostty graphics

# True color (Ghostty)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ",xterm-ghostty:RGB"

# ── Seamless nav: Ctrl+hjkl across nvim splits + tmux panes ──
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Copy mode → macOS clipboard (vi keys + mouse drag)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X clear-selection

# Splits (keep cwd)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Rearrange: move the current window left/right in the bar · join another window here as a pane (prefix ! splits a pane out again)
bind -r C-h swap-window -t -1 \; select-window -t -1
bind -r C-l swap-window -t +1 \; select-window -t +1
bind j choose-window -Z "join-pane -h -s '%%'"

# Resize (prefix + HJKL, repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Popups
bind g display-popup -w 90% -h 90% -E "lazygit"
bind ? display-popup -w 90% -h 90% -E "nvim -R -c 'lua require(\"config.markdown-zen\").toggle()' ~/.dotfiles/cheatsheet.md"
bind b display-popup -w 85% -h 80% -T " brain · q/Esc to close " "~/.dotfiles/bin/brain status"
bind k display-popup -w 85% -h 80% -T " processes & ports · TAB select · ENTER stop " -E "~/.dotfiles/bin/devctl pick"
bind a display-popup -w 85% -h 80% -T " Claude sessions " -E "~/.dotfiles/bin/devctl sessions"
bind N command-prompt -p "new session:" "new-session -c '#{pane_current_path}' -s '%%'"

# Reload
bind r source-file ~/.tmux.conf \; display "tmux reloaded"

# ── Moss theme, catppuccin-tmux layout (omerxx): session pill · windows with number pills · folder on the right ──
set -g status-position top
set -g status-justify left
set -g status-style "bg=default,fg=#80887f"
set -g status-left-length 60
set -g status-left "#[fg=#3fd468,bg=default]#[fg=#151719,bg=#3fd468] #[fg=#e2e5df,bg=#1e2124] #S #[fg=#1e2124,bg=default] "
set -g status-right-length 100
set -g status-right "#{?client_prefix,#[fg=#e6c07b]● PREFIX ,}#[fg=#e6c07b,bg=default]#[fg=#151719,bg=#e6c07b] #[fg=#e2e5df,bg=#1e2124] #{b:pane_current_path} #[fg=#1e2124,bg=default]"
setw -g window-status-format "#[fg=#1e2124,bg=default]#[fg=#80887f,bg=#1e2124]#W #[fg=#151719,bg=#50574f] #I#[fg=#50574f,bg=default] "
setw -g window-status-current-format "#[fg=#242b26,bg=default]#[fg=#e2e5df,bg=#242b26,bold]#W#{?window_zoomed_flag, ,} #[fg=#151719,bg=#3fd468] #I#[fg=#3fd468,bg=default] "
setw -g window-status-separator ""
set -g pane-border-style "fg=#272b29"
set -g pane-active-border-style "fg=#3fd468"
set -g message-style "bg=#3fd468,fg=#151719,bold"
set -g mode-style "bg=#242b26,fg=#e2e5df"
set -g popup-border-style "fg=#3fd468"
set -g menu-style "bg=#1e2124,fg=#e2e5df"
set -g menu-selected-style "bg=#242b26,fg=#3fd468,bold"
set -g menu-border-style "fg=#272b29"

# ── Plugins (TPM) · prefix I install · prefix U update ──
# resurrect/continuum: sessions, windows, dirs survive reboot (auto-save 15 min, auto-restore on start)
# claude-hatch: prefix y = Claude popup for this dir · prefix u = picker of running agents (status, bell)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'craftzdog/tmux-claude-hatch'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# sessionx: prefix s = session picker (type a new name or a folder → new session via zoxide)
set -g @sessionx-bind 's'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-fzf-builtin-tmux 'on'
set -g @sessionx-filter-current 'false'
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '55%'
set -g @sessionx-layout 'reverse'
set -g @sessionx-pointer '▌'
set -g @sessionx-git-branch 'off'
set -g @sessionx-window-height '80%'
set -g @sessionx-window-width '85%'
set -g @sessionx-additional-options "--color=pointer:#3fd468,marker:#e6c07b,spinner:#74d0b8,header:#80887f,border:#2c312d,label:#3fd468"

# fzf-url: prefix Ctrl+u = pick a URL from the screen and open it (u stays claude-hatch)
set -g @fzf-url-bind 'C-u'
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# floax: prefix F = floating scratch shell (toggle) · prefix M = its menu (P stays Plannotator)
set -g @floax-bind 'F'
set -g @floax-bind-menu 'M'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color '#3fd468'
set -g @floax-text-color '#e2e5df'

run '~/.tmux/plugins/tpm/tpm'

# Plannotator: prefix P (Shift+p) opens a menu — L = a Claude session's last reply (browser), T = a markdown file (terminal)
bind P display-menu -T " Plannotator " \
  "Last reply of a Claude session (browser)" L "display-popup -E -s bg=#151719 -w 90% -h 90% -d '#{pane_current_path}' '~/.dotfiles/bin/pn last'" \
  "Last reply of a Claude session (terminal)" R "display-popup -E -s bg=#151719 -w 90% -h 90% '~/.dotfiles/bin/pn tlast'" \
  "Annotate a markdown file (terminal)" T "display-popup -E -s bg=#151719 -w 90% -h 90% -d '#{pane_current_path}' '~/.dotfiles/bin/pn file'"
